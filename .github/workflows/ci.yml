name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, shellcheck, module evaluation and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check formatting
        run: nix fmt -- --check

      # These are the fast, hermetic checks: NixOS module evaluation, seedable
      # policy assertions, ShellCheck over every shipped script, and the
      # isolated shell-level suites that drive the manager, carrier watcher and
      # QGA helpers against fake sockets. None of them need a VM or KVM.
      - name: Run construction checks
        run: |
          set -euo pipefail
          # The runner is x86_64-linux, which is also the only system the
          # integration checks are defined for.
          for check in \
            module-evaluation \
            shellcheck \
            module-tests \
            carrier-watcher-tests \
            qga-exec-tests \
            qga-systemd-health-tests
          do
            echo "::group::checks.x86_64-linux.${check}"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.${check}"
            echo "::endgroup::"
          done

  vm-tests:
    name: NixOS integration tests
    runs-on: ubuntu-latest
    # Boots real VMs, so it is slower and only runs where it is allowed to be:
    # never to gate an unrelated pull request.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      # KVM is not available on standard GitHub-hosted runners, so the test
      # driver falls back to TCG emulation. This is slower but functional.
      - name: Report hardware acceleration
        run: |
          if [ -w /dev/kvm ]; then
            echo "KVM available; tests will be hardware-accelerated."
          else
            echo "No /dev/kvm; running under TCG (slower)."
          fi

      - name: Run integration tests
        run: |
          set -euo pipefail
          for check in systemd-integration vm-logs-integration; do
            echo "::group::checks.x86_64-linux.${check}"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.${check}"
            echo "::endgroup::"
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-test-logs
          path: |
            result/
          if-no-files-found: ignore
          retention-days: 7

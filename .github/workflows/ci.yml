name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, shellcheck, module evaluation and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      # treefmt's CI mode (--ci) implies --no-cache and --fail-on-change.
      - name: Check formatting
        run: nix fmt -- --ci

      # These are the fast, hermetic checks: NixOS module evaluation, seedable
      # policy assertions, ShellCheck over every shipped script, and the
      # isolated shell-level suites that drive the manager, carrier watcher and
      # QGA helpers against fake sockets. None of them need a VM or KVM, so
      # they are reliable on a hosted runner and gate every push and PR.
      #
      # The NixOS integration tests boot real VMs and therefore require KVM;
      # see .github/workflows/integration.yml.
      - name: Run construction checks
        run: |
          set -euo pipefail
          # The runner is x86_64-linux, which is also the only system the
          # checks are defined for.
          for check in \
            module-evaluation \
            shellcheck \
            module-tests \
            carrier-watcher-tests \
            qga-exec-tests \
            qga-systemd-health-tests
          do
            echo "::group::checks.x86_64-linux.${check}"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.${check}"
            echo "::endgroup::"
          done

  vm-logs-integration:
    name: vm-logs read-only mount integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Boots a real VM and attaches a real qcow2 image over NBD, so it needs
      # QEMU but not KVM: it passes under TCG emulation on a hosted runner.
      # This is the check that proves the analyser cannot modify the evidence.
      - name: Run vm-logs integration test
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.vm-logs-integration"

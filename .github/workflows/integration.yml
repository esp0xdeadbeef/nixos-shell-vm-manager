name: Integration tests

# Boots a real NixOS VM and waits on guest state for up to 900s at a time.
#
# `systemd-integration` waits that long for guest-shutdown recovery, which does
# not complete under TCG emulation. A hosted runner without /dev/kvm therefore
# cannot run it reliably, so it is manual by design: start it from the Actions
# tab, or point `runs-on` at a self-hosted runner that exposes /dev/kvm.
#
# It is not part of the push/PR gate. `vm-logs-integration` does not depend on
# KVM and is covered by the blocking checks in ci.yml.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Space-separated check names to run
        required: false
        default: systemd-integration

permissions:
  contents: read

jobs:
  vm-tests:
    name: NixOS VM integration tests
    # A self-hosted runner with /dev/kvm works here unchanged; switch this to
    # `runs-on: [ self-hosted, linux, kvm ]` to use one.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Report hardware acceleration
        run: |
          if [ -w /dev/kvm ]; then
            echo "KVM available; tests will be hardware-accelerated."
          else
            echo "::warning::No /dev/kvm; falling back to TCG emulation, which is slow and may exceed guest wait timeouts."
          fi

      - name: Run integration checks
        run: |
          set -euo pipefail
          for check in ${{ inputs.checks }}; do
            echo "::group::checks.x86_64-linux.${check}"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.${check}"
            echo "::endgroup::"
          done

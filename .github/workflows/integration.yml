name: Integration tests

# These checks boot real NixOS VMs with QEMU and wait on guest state for up to
# 900s at a time. They need hardware acceleration to be reliable: on a runner
# without /dev/kvm the test driver falls back to TCG emulation, where the
# guest-shutdown-recovery waits in `systemd-integration` exceed their timeouts.
#
# They are therefore manual by design: run them from the Actions tab, or point
# `runs-on` at a self-hosted runner that exposes /dev/kvm. They are not part of
# the push/PR gate, so a slow or absent accelerator can never block a change
# that the hermetic checks in ci.yml already cover.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Space-separated check names to run
        required: false
        default: systemd-integration vm-logs-integration

permissions:
  contents: read

jobs:
  vm-tests:
    name: NixOS VM integration tests
    # A self-hosted runner with /dev/kvm works here unchanged; switch this to
    # `runs-on: [ self-hosted, linux, kvm ]` to use one.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Report hardware acceleration
        run: |
          if [ -w /dev/kvm ]; then
            echo "KVM available; tests will be hardware-accelerated."
          else
            echo "::warning::No /dev/kvm; falling back to TCG emulation, which is slow and may exceed guest wait timeouts."
          fi

      - name: Run integration checks
        run: |
          set -euo pipefail
          for check in ${{ inputs.checks }}; do
            echo "::group::checks.x86_64-linux.${check}"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.${check}"
            echo "::endgroup::"
          done
